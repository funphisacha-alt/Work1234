/* ---------- บทเรียน ---------- */
const LS=[
['🤖🧑‍🔬','งานทางฟิสิกส์คืออะไร?','<p class=say>โรโบ: "แบกกระเป๋าหนักแล้วเหนื่อย แปลว่าทำงานไหม?"</p><p>ในวิทยาศาสตร์ <b>งาน</b> เกิดเมื่อมี <b>แรงกระทำต่อวัตถุ</b> และวัตถุ <b>เคลื่อนที่ไปในทิศทางเดียวกับแรง</b> ถ้าขาดอย่างใดอย่างหนึ่ง = ไม่เกิดงาน</p>'],
['📦🧳🧱','อย่างไหนเกิดงาน?','<div class=two><div class=yes>✅ <b>เกิดงาน</b><br>📦 ยกกล่องขึ้นโต๊ะ<br>🧳 ลากกระเป๋าไปข้างหน้า<br>🛒 เข็นรถขึ้นทางลาด</div><div class=nop>❌ <b>ไม่เกิดงาน</b><br>🧱 ผลักกำแพงไม่ขยับ<br>🏋️ ถือกล่องยืนนิ่ง ๆ</div></div>'],
['📏⚡','สูตรของงาน','<div class=f><i>W</i> = F × s</div><p><i>W</i> = <b>งาน</b> (หน่วย จูล, J) · F = แรง (นิวตัน, N) · s = ระยะที่เคลื่อนที่ (เมตร, m)</p><p class=say>⚠️ ระวัง! <i>W</i> ในสูตรหมายถึง "งาน" ส่วนหน่วย <b>W (วัตต์)</b> เป็นหน่วยของ "กำลัง"</p><p>ตัวอย่าง: แรง 10 N ผลักไป 3 m → W = 10 × 3 = <b>30 J</b></p>'],
['🔋⏱️','พลังงานและกำลัง','<p><b>พลังงาน</b> คือความสามารถในการทำงาน เมื่อทำงาน = มีการถ่ายโอนพลังงาน (หน่วย จูล เหมือนกัน)</p><div class=f>P = W ÷ t</div><p><b>กำลัง (P)</b> = งานที่ทำได้ใน 1 วินาที หน่วย <b>วัตต์ (W)</b> โดย 1 W = 1 J/s</p><p>ตัวอย่าง: งาน 60 J ใน 3 s → P = 60 ÷ 3 = <b>20 วัตต์</b></p><p>งานเท่ากัน ใช้เวลาน้อยกว่า → กำลังมากกว่า</p>'],
['🪵📐🎡','เครื่องกลอย่างง่าย','<p>🪵 <b>คาน</b> มีจุดหมุน ช่วยผ่อนแรง เช่น ชะแลง ที่เปิดขวด</p><p>📐 <b>พื้นเอียง</b> ใช้แรงน้อยลง แต่ต้องเคลื่อนที่ไกลขึ้น เช่น ทางลาดขึ้นรถ</p><p>🎡 <b>รอก</b> ตายตัว = เปลี่ยนทิศทางแรง · เคลื่อนที่ = ผ่อนแรงลงประมาณครึ่งหนึ่ง</p><p class=say>เครื่องกลช่วย <b>ผ่อนแรง</b> ได้ แต่ <b>ไม่ได้ทำให้งานที่ต้องใช้ลดลง</b></p>']];
function lesson(i){const l=LS[i];R(`<div class=card><div class=big>${l[0]}</div><h2>${l[1]}</h2>${l[2]}<div>${i>0?`<button class=gr onclick="lesson(${i-1})">◀ ก่อนหน้า</button>`:''}${i<LS.length-1?`<button onclick="lesson(${i+1})">ถัดไป ▶</button>`:'<button class=g onclick="startStage(1)">ไปทำแบบทดสอบ ✏️</button>'}</div><span class=tag>หน้า ${i+1}/${LS.length}</span></div>`)}

/* ---------- หน้าจอหลัก ---------- */
function newGame(){G={score:0,bonus:0,log:[],stages:{},streak:0};S=null;updHud()}
function updHud(){$('#sc').textContent=G?G.score:0;const d=G?Object.values(G.stages).filter(x=>x.pass).length:0,f=S&&S.run?S.i/S.qs.length:0;$('#pg i').style.width=Math.min(100,(d+f)/4*100)+'%'}
function home(){clearInterval(tm);G=null;S=null;updHud();R(`<div class=card style="text-align:center"><div class=big>🤖⚡🧑‍🔬</div><h1>MISSION: WORK & ENERGY</h1><p><b>ภารกิจพิชิตโลกงานและพลังงาน</b></p><div style="text-align:left"><p>🎯 <b>กติกา</b></p><p>• เริ่มที่ 0 คะแนน ผ่าน 4 ด่าน ตอบถูกได้คะแนน ถูกต่อเนื่อง 3 ข้อขึ้นไปและตอบเร็วได้โบนัส<br>• ผ่านด่านต้องตอบถูกอย่างน้อย 60% จึงจะปลดล็อกด่านถัดไป<br>• ตอบผิดไม่เสียคะแนน และขอคำใบ้ได้ไม่หักคะแนน<br>• ทุกข้อมีคำอธิบาย กดปุ่ม 🔊 เพื่อเปิด–ปิดเสียง</p></div><button class=g onclick="newGame();hub()">เริ่มเล่น 🚀</button></div>`)}
function hub(){clearInterval(tm);S=null;updHud();let h='<div class=card><h2>🗺️ แผนที่ภารกิจ</h2></div>';for(let i=1;i<=4;i++){const s=G.stages[i],lk=i>1&&!(G.stages[i-1]&&G.stages[i-1].pass);h+=`<div class="card st ${lk?'lock':''}"><div><b>${ST[i].ic} ด่าน ${i}: ${ST[i].n}</b><br><span>${ST[i].th}</span><br>${lk?'🔒 ผ่านด่านก่อนหน้าเพื่อปลดล็อก':s?(s.pass?'✅ ผ่านแล้ว ':'❌ ยังไม่ผ่าน ')+'⭐'.repeat(s.stars)+' · '+s.sc+' คะแนน':'ยังไม่เล่น'}</div><button class="${s?'o':'g'}" ${lk?'disabled':''} onclick="go(${i})">${i==1&&!s?'เริ่มเรียนรู้':s?'เล่นอีกครั้ง':'เริ่มด่านนี้'}</button></div>`}
h+=`<div>${G.stages[4]?'<button class=o onclick=summary()>📊 ดูสรุปผล</button>':''}<button class=gr onclick=home()>🔄 เริ่มเล่นใหม่ทั้งหมด</button></div>`;R(h)}
const go=i=>i==1?lesson(0):startStage(i);

/* ---------- ระบบด่าน ---------- */
function startStage(id){const o=G.stages[id];if(o){G.score-=o.sc;G.bonus-=o.bn;delete G.stages[id]}
G.log=G.log.filter(l=>l.st!=id);G.streak=0;
const qs=id==1?Q1:id==2?shuf(Q2):id==3?shuf(gens).map(g=>({k:'num',p:15,...g()})):Q4;
S={id,qs,i:0,sc:0,ok:0,bn:0,run:true,over:false,per:id==2?20:id==3?40:0,tot:id==4?240:0,max:qs.reduce((a,q)=>a+q.p,0),t0:Date.now()};
if(S.tot)S.tdl=Date.now()+S.tot*1000;startTick();showQ()}
function startTick(){clearInterval(tm);tm=setInterval(()=>{if(!S||!S.run)return;const full=S.tot||S.per;if(!full)return;
const now=Date.now(),rem=S.tot?(S.tdl-now)/1000:(S.dl-now)/1000;
if(!S.tot&&S.ans)return;
const b=$('#tb'),l=$('#tm');if(b){b.style.width=Math.max(0,rem/full*100)+'%';b.style.background=rem<6?'#ef4444':'#22c55e'}
if(l)l.textContent=S.tot?'⏱️ เวลารวม '+fmt(Math.max(0,Math.ceil(rem))):'⏱️ '+Math.max(0,Math.ceil(rem))+' วินาที';
if(rem<=0){if(S.tot){S.over=true;const n=$('#nx');if(n)n.textContent='⏰ หมดเวลา ดูผลด่าน'}if(!S.ans)done(false,'(หมดเวลา)',true)}},250)}
function showQ(){const q=S.q=S.qs[S.i];S.ans=false;if(S.per)S.dl=Date.now()+S.per*1000;S.hn=0;
const lv=S.id==4?`<span class=tag>${q.p==5?'ง่าย':q.p==8?'ปานกลาง':'ท้าทาย'}</span>`:'';let body;
if(q.k=='mc'){q.sh=shuf(q.o);body=q.sh.map((t,i)=>`<button class=opt onclick="pk(${i})">${'กขคง'[i]}. ${t}</button>`).join('')}
else body=`<div class=row><input id=inp type=text inputmode=decimal autocomplete=off placeholder="ตัวเลข" onkeydown="if(event.key=='Enter')chk()"><b>${q.u}</b></div><div>${'<button class=g onclick=chk()>✅ ตรวจคำตอบ</button>'}${q.h?'<button class=o id=hb onclick=hint()>💡 ขอคำใบ้</button>':''}</div><div id=hn></div>`;
R(`<div class=card><div class=row><b>${ST[S.id].ic} ด่าน ${S.id}</b><span>ข้อ ${S.i+1}/${S.qs.length}</span>${lv}<span id=tm></span></div>${S.per||S.tot?'<div class=bar><i id=tb></i></div>':''}<h2>${q.q}</h2>${body}<div id=fb></div></div>`);updHud();const i=$('#inp');if(i)i.focus()}
function pk(i){if(S.ans)return;const t=S.q.sh[i];done(t==S.q.o[0],t,false)}
function chk(){if(S.ans)return;const v=$('#inp').value.trim().replace(',','.');if(v===''||isNaN(+v)){$('#fb').innerHTML='<div class="fb no">กรอกตัวเลขก่อนนะ (ทศนิยมใช้จุดได้)</div>';return}
done(Math.abs(+v-S.q.a)<0.01,v+' '+S.q.u,false)}
function hint(){const q=S.q;if(S.hn>=q.h.length)return;S.hn++;$('#hn').innerHTML=q.h.slice(0,S.hn).map((x,i)=>`<p>💡 คำใบ้ ${i+1}: ${x}</p>`).join('');if(S.hn>=q.h.length)$('#hb').disabled=true}
function done(ok,given,to){if(S.ans)return;S.ans=true;const q=S.q;let g=0,b=0;
if(ok){G.streak++;g=q.p;if(G.streak>=3)b+=3;if(S.per&&(S.dl-Date.now())/1000>S.per*.5)b+=2;S.ok++}else G.streak=0;
S.sc+=g+b;S.bn+=b;G.score+=g+b;G.bonus+=b;
const ans=q.k=='mc'?q.o[0]:q.a+' '+q.u;
G.log.push({st:S.id,tp:q.tp,q:q.q,ok,given,ans,e:q.e});
if(q.k=='mc')document.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(q.sh[i]==q.o[0])x.classList.add('ok');else if(q.sh[i]==given)x.classList.add('no')});
else document.querySelectorAll('.card button,#inp').forEach(x=>x.disabled=true);
sfx(ok?'ok':'no');
$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'🎉 <b>ถูกต้อง!</b> +'+g+(b?' (โบนัส +'+b+')':''):(to?'⏰ <b>หมดเวลา!</b>':'❌ <b>ยังไม่ถูกนะ</b>')+' คำตอบที่ถูกคือ <b>'+ans+'</b>'}<p>💡 ${q.e}</p></div><button class=g id=nx onclick=nx()>${S.over?'⏰ หมดเวลา ดูผลด่าน':S.i+1>=S.qs.length?'ดูผลด่าน 🏁':'ข้อต่อไป ▶'}</button>`;
updHud();$('#nx').focus()}
function nx(){S.i++;if(S.i>=S.qs.length||S.over)finish();else showQ()}
function finish(){clearInterval(tm);S.run=false;
for(let j=S.i;j<S.qs.length;j++){const q=S.qs[j];G.log.push({st:S.id,tp:q.tp,q:q.q,ok:false,given:'(ไม่ได้ทำ เพราะหมดเวลา)',ans:q.k=='mc'?q.o[0]:q.a+' '+q.u,e:q.e})}
const n=S.qs.length,r=S.ok/n,pass=r>=.6;let pb=0;if(S.ok==n)pb+=5;if(S.id==4&&pass&&!S.over)pb+=5;
S.sc+=pb;S.bn+=pb;G.score+=pb;G.bonus+=pb;
const stars=!pass?0:r>=.9?3:r>=.75?2:1;
G.stages[S.id]={sc:S.sc,bn:S.bn,ok:S.ok,n,pass,stars,max:S.max,time:Math.round((Date.now()-S.t0)/1000)};
updHud();const id=S.id;pass?sfx('win'):0;if(pass&&id==4)confetti();
R(`<div class=card style="text-align:center"><div class=big>${pass?(id==4?'🏆':'🎖️'):'💪'}</div><h1>${pass?(id==4?'ปลดล็อกถ้วยรางวัล!':'ผ่านด่าน '+id+'!'):'เกือบแล้ว! ลองอีกครั้ง'}</h1><p style="font-size:30px">${stars?'⭐'.repeat(stars):'☆☆☆'}</p><p>ตอบถูก <b>${S.ok}/${n}</b> ข้อ · ได้ <b>${S.sc}</b> คะแนน${pb?' (รวมโบนัสจบด่าน +'+pb+')':''}</p><p>${pass?'ยอดเยี่ยม! ความรู้ของคุณแน่นขึ้นแล้ว':'ต้องตอบถูกอย่างน้อย 60% จึงจะผ่าน ทบทวนคำอธิบายแล้วลองใหม่ได้เลย'}</p>
${pass&&id<4?`<button class=g onclick="go(${id+1})">ไปด่านต่อไป ▶</button>`:''}${pass&&id==4?'<button class=g onclick=summary()>📊 ดูสรุปผล</button>':''}${!pass?`<button class=o onclick="go(${id})">🔁 ลองอีกครั้ง</button>`:''}${!pass&&id==4?'<button class=g onclick=summary()>📊 ดูสรุปผล</button>':''}<button class=gr onclick=hub()>🗺️ แผนที่ด่าน</button></div>`)}

/* ---------- สรุปผล ---------- */
function summary(){clearInterval(tm);const L=G.log,ok=L.filter(l=>l.ok).length,wr=L.length-ok,mx=Object.values(G.stages).reduce((a,x)=>a+x.max,0),tt=Object.values(G.stages).reduce((a,x)=>a+x.time,0),base=G.score-G.bonus,pct=mx?base/mx*100:0;
const tier=pct>=85?['🧙‍♂️','ปรมาจารย์งานและพลังงาน','สุดยอดมาก! คุณเข้าใจงานและกำลังอย่างลึกซึ้ง ถ่ายทอดให้เพื่อน ๆ ได้เลย ✨']:pct>=60?['🧠','นักคิดนักคำนวณ','เก่งมาก! คุณคำนวณและวิเคราะห์ได้ดี ทบทวนอีกนิดก็เป็นปรมาจารย์แล้ว 🌟']:['🔭','นักสำรวจพลังงาน','ภูมิใจที่คุณลุยจนจบ! ทุกข้อที่พลาดคือโอกาสเรียนรู้ ลองเล่นอีกครั้งแล้วจะดีขึ้นแน่นอน 💪'];
const tp={};L.forEach(l=>{const t=tp[l.tp]=tp[l.tp]||{n:0,k:0};t.n++;if(l.ok)t.k++});
const rows=Object.keys(tp).map(k=>{const p=Math.round(tp[k].k/tp[k].n*100);return `<p>${p>=70?'✅':'📚'} ${T[k]} — ${tp[k].k}/${tp[k].n} ข้อ <b>${p>=70?'ทำได้ดี':'ควรทบทวน'}</b></p>`}).join('');
const sr=[1,2,3,4].map(i=>{const s=G.stages[i];return s?`<p>${ST[i].ic} ด่าน ${i}: ${s.pass?'ผ่าน':'ยังไม่ผ่าน'} ${'⭐'.repeat(s.stars)} (${s.ok}/${s.n} ข้อ, ${s.sc} คะแนน)</p>`:''}).join('');
R(`<div class=card style="text-align:center"><div class=big>${tier[0]}</div><h1>${tier[1]}</h1><p>${tier[2]}</p></div><div class=card><h2>📊 ผลการเล่น</h2><p>คะแนนรวม <b>${G.score}</b> (คะแนนจากคำตอบ ${base}/${mx} + โบนัส ${G.bonus})<br>ตอบถูก <b>${ok}</b> ข้อ · ตอบผิด/ไม่ได้ทำ <b>${wr}</b> ข้อ<br>เวลาที่ใช้ในด่านทั้งหมด <b>${fmt(tt)}</b> นาที</p>${sr}</div><div class=card><h2>🎯 หัวข้อของคุณ</h2>${rows}</div><div><button class=g onclick="newGame();hub()">🔁 เล่นอีกครั้ง</button><button class=o onclick=rv()>📝 ทบทวนคำตอบ</button><button class=gr onclick=hub()>🗺️ แผนที่ด่าน</button></div><div id=rv></div>`)}
function rv(){const e=$('#rv');if(e.innerHTML){e.innerHTML='';return}
e.innerHTML='<div class=card><h2>📝 ทบทวนคำตอบ</h2>'+G.log.map((l,i)=>`<div class=rv><p>${l.ok?'✅':'❌'} <b>ด่าน ${l.st} ข้อ ${i+1}</b>: ${l.q}</p><p>คำตอบของคุณ: ${l.given}${l.ok?'':'<br>เฉลย: <b>'+l.ans+'</b>'}</p><p>💡 ${l.e}</p></div>`).join('')+'</div>';e.scrollIntoView({behavior:'smooth'})}
home();
</script></body></html>
